<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var w = 6059;
  var h = 12681;
  var maxZoom = 6;
  var minZoom = 3;

  var map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: minZoom,
    maxZoom: maxZoom,
    zoomSnap: 0.1,
    maxBoundsViscosity: 1.0,
    attributionControl: false // <-- Отключает копирайт Leaflet внизу справа
  });

  var southWest = map.unproject([0, h], maxZoom);
  var northEast = map.unproject([w, 0], maxZoom);
  var bounds = new L.LatLngBounds(southWest, northEast);

  L.tileLayer('tiles/{z}/{y}/{x}.png', {
    minZoom: minZoom,
    maxZoom: maxZoom,
    tileSize: 256,
    bounds: bounds,
    noWrap: true,
    errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7'
  }).addTo(map);

  map.setMaxBounds(bounds);

  // Начальная позиция и масштаб
  var initialX = 2800;
  var initialY = 8500;
  var startZoom = 4.8;

  var startCenter = map.unproject([initialX, initialY], maxZoom);
  map.setView(startCenter, startZoom);

  window.addEventListener('load', function() {
    setTimeout(function() {
      map.invalidateSize();
    }, 200);
  });

// Попап для определения координат по клику (потом мы его удалим)
var popup = L.popup();
map.on('click', function(e) {
    let y = Math.round(e.latlng.lat);
    let x = Math.round(e.latlng.lng);
    popup
        .setLatLng(e.latlng)
        .setContent("Координаты точки: [" + y + ", " + x + "]")
        .openOn(map);
});
