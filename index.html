<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var w = 6059;
  var h = 12681;
  var maxZoom = 6;
  var minZoom = 3;

  var map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: minZoom,
    maxZoom: maxZoom,
    zoomSnap: 0.1,
    maxBoundsViscosity: 1.0,
    attributionControl: false
  });

  var southWest = map.unproject([0, h], maxZoom);
  var northEast = map.unproject([w, 0], maxZoom);
  var bounds = new L.LatLngBounds(southWest, northEast);

  L.tileLayer('tiles/{z}/{y}/{x}.png', {
    minZoom: minZoom,
    maxZoom: maxZoom,
    tileSize: 256,
    bounds: bounds,
    noWrap: true,
    errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7'
  }).addTo(map);

  map.setMaxBounds(bounds);

  // Начальная позиция и масштаб
  var initialX = 2800;
  var initialY = 8500;
  var startZoom = 4.8;

  var startCenter = map.unproject([initialX, initialY], maxZoom);
  map.setView(startCenter, startZoom);

  window.addEventListener('load', function() {
    setTimeout(function() {
      map.invalidateSize();
    }, 200);
  });

  // Попап для определения координат
  var popup = L.popup();
  map.on('click', function(e) {
    let y = Math.round(e.latlng.lat);
    let x = Math.round(e.latlng.lng);
    popup
        .setLatLng(e.latlng)
        .setContent("Координаты точки: [" + y + ", " + x + "]")
        .openOn(map);
  });

  // ==========================================
  // 1. СПИСОК ОСНОВНЫХ ТОЧЕК МАРШРУТА
  // ==========================================
  var mainRoutePoints = [
    { coords: [-193, 55], id: "route-point-1", iconUrl: "icons/icon-1.png", size: [60, 53] },
   { coords: [-193, 55], id: "route-point-1",  iconUrl: "icons/icon-1.png",  size: [60, 53] },
  { coords: [-172, 73], id: "route-point-2",  iconUrl: "icons/icon-2.png",  size: [66, 43] },
  { coords: [-168, 70], id: "route-point-3",  iconUrl: "icons/icon-3.png",  size: [63, 44] },
  { coords: [-161, 69], id: "route-point-4",  iconUrl: "icons/icon-4.png",  size: [66, 54] },
  { coords: [-154, 57], id: "route-point-5",  iconUrl: "icons/icon-5.png",  size: [74, 50] },
  { coords: [-113, 16], id: "route-point-6",  iconUrl: "icons/icon-6.png",  size: [46, 61] },
  { coords: [-93, 57],  id: "route-point-7",  iconUrl: "icons/icon-7.png",  size: [109, 41] },
  { coords: [-83, 59],  id: "route-point-8",  iconUrl: "icons/icon-8.png",  size: [60, 54] },
  { coords: [-81, 67],  id: "route-point-9",  iconUrl: "icons/icon-9.png",  size: [63, 53] },
  { coords: [-70, 65],  id: "route-point-10", iconUrl: "icons/icon-10.png", size: [73, 45] },
  { coords: [-75, 59],  id: "route-point-11", iconUrl: "icons/icon-11.png", size: [71, 50] },
  { coords: [-60, 56],  id: "route-point-12", iconUrl: "icons/icon-12.png", size: [69, 53] },
  { coords: [-56, 49],  id: "route-point-13", iconUrl: "icons/icon-13.png", size: [83, 42] },
  { coords: [-33, 61],  id: "route-point-14", iconUrl: "icons/icon-14.png", size: [66, 45] }
];

  // ==========================================
  // 2. ВЫВОД ТОЧЕК И ПЛАВНАЯ РЕГУЛИРОВКА РАЗМЕРА
  // ==========================================
  var markersList = [];

  mainRoutePoints.forEach(function(point) {
    var baseWidth = (point.size && point.size[0]) ? point.size[0] : 60;
    var baseHeight = (point.size && point.size[1]) ? point.size[1] : 53;
    var ratio = baseHeight / baseWidth;

    var customIcon = L.icon({
      iconUrl: point.iconUrl,
      iconSize: [baseWidth, baseHeight],
      iconAnchor: [baseWidth / 2, baseHeight]
    });

    var marker = L.marker(point.coords, { icon: customIcon }).addTo(map);

    marker.baseData = {
      iconUrl: point.iconUrl,
      baseWidth: baseWidth,
      ratio: ratio
    };

    markersList.push(marker);

    marker.on('click', function() {
      alert("Клик: " + point.id);
    });
  });

  function updateIconSizes() {
    var currentZoom = map.getZoom();

    var minZ = 4.8; // Общий вид карты (60px)
    var maxZ = 6.0; // Максимальное приближение (260px)

    // Расчет коэффициента прогресса от 0 до 1
    var progress = (currentZoom - minZ) / (maxZ - minZ);
    if (progress < 0) progress = 0;
    if (progress > 1) progress = 1;

    // Ширина плавно растет от 60px до 260px
    var targetWidthAtMaxZoom = 260; 
    var scaleMultiplier = 1 + progress * ((targetWidthAtMaxZoom / 60) - 1);

    markersList.forEach(function(marker) {
      var base = marker.baseData;
      var newWidth = base.baseWidth * scaleMultiplier;
      var newHeight = newWidth * base.ratio;

      marker.setIcon(L.icon({
        iconUrl: base.iconUrl,
        iconSize: [newWidth, newHeight],
        iconAnchor: [newWidth / 2, newHeight]
      }));
    });
  }

  updateIconSizes();
  map.on('zoom', updateIconSizes);
  map.on('zoomend', updateIconSizes);

// ==========================================
  // ВТОРОСТЕПЕННЫЕ ИНФОРМАЦИОННЫЕ ТОЧКИ
  // ==========================================

    popupAnchor: [0, -32]           // Смещение бабла относительно иконки

    },
    {

    },

    },
    {

    },
    { 
      coords: [-50, 60], 
      title: "Городовой",

    },
    { 
      coords: [-50, 60], 
      title: "Городовой", 
      text: "«Городовой» — жанровая скульптура, установленная во Владикавказе в 2013 году." 
    },
    { 
      coords: [-5, 51], 
      title: "Кинематограф Гигант", 
      text: "Здание бывшего кинематографа «Гигант». Было построено 110 лет назад итальянским акционерным обществом." 
    },
    { 
      coords: [-70, 59], 
      title: "Кинематограф Пате",

    },
    { 
      coords: [-80, 60],

      text: "Старейшая аптека № 3 во Владикавказе. Ведет историю с 1895 года." 
    },
    { 
      coords: [-143, 68], 
      title: "Сквер", 
      text: "На этом месте раньше находился кинотеатр Октябрь." 
    },
    { 
      coords: [-94, 30], 
      title: "Кафе Станция", 
      text: "Внутри кафе можно увидеть водопроводную систему парка." 
    }
  ];

  // 3. Вывод на карту с открытием по тапу/клику
  secondaryPoints.forEach(function(point) {
    var marker = L.marker(point.coords, { icon: infoIcon }).addTo(map);

    marker.bindPopup(`<b>${point.title}</b><br>${point.text}`, {
      closeButton: false,
      offset: [0, -10]
    });
  });
</script>

</body>
</html>
