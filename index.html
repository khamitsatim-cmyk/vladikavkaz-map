<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var w = 6059;
  var h = 12681;
  var maxZoom = 6;
  var minZoom = 3;

  var map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: minZoom,
    maxZoom: maxZoom,
    zoomSnap: 0.1,
    maxBoundsViscosity: 1.0,
    attributionControl: false
  });

  var southWest = map.unproject([0, h], maxZoom);
  var northEast = map.unproject([w, 0], maxZoom);
  var bounds = new L.LatLngBounds(southWest, northEast);

  L.tileLayer('tiles/{z}/{y}/{x}.png', {
    minZoom: minZoom,
    maxZoom: maxZoom,
    tileSize: 256,
    bounds: bounds,
    noWrap: true,
    errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7'
  }).addTo(map);

  map.setMaxBounds(bounds);

  // Начальная позиция и масштаб
  var initialX = 2800;
  var initialY = 8500;
  var startZoom = 4.8;

  var startCenter = map.unproject([initialX, initialY], maxZoom);
  map.setView(startCenter, startZoom);

  window.addEventListener('load', function() {
    setTimeout(function() {
      map.invalidateSize();
    }, 200);
  });

  // Попап для определения координат
  var popup = L.popup();
  map.on('click', function(e) {
    let y = Math.round(e.latlng.lat);
    let x = Math.round(e.latlng.lng);
    popup
        .setLatLng(e.latlng)
        .setContent("Координаты точки: [" + y + ", " + x + "]")
        .openOn(map);
  });

  // ==========================================
  // 1. СПИСОК ИЛЛЮСТРАЦИЙ
  // width и height — реальные размеры иллюстрации в пикселях исходного макета
  // ==========================================
  var mainRoutePoints = [
    { coords: [-193, 55], id: "route-point-1", iconUrl: "icons/icon-1.png", width: 420, height: 374 },
    { coords: [-172, 73], id: "route-point-2", iconUrl: "icons/icon-2.png", width: 350, height: 300 },
    { coords: [-166, 70], id: "route-point-3", iconUrl: "icons/icon-3.png", width: 350, height: 300 },
    { coords: [-160, 69], id: "route-point-4", iconUrl: "icons/icon-4.png", width: 350, height: 300 },
    { coords: [-154, 57], id: "route-point-5", iconUrl: "icons/icon-5.png", width: 350, height: 300 },
    { coords: [-112, 16], id: "route-point-6", iconUrl: "icons/icon-6.png", width: 350, height: 300 },
    { coords: [-93, 57], id: "route-point-7", iconUrl: "icons/icon-7.png", width: 350, height: 300 },
    { coords: [-83, 59], id: "route-point-8", iconUrl: "icons/icon-8.png", width: 350, height: 300 },
    { coords: [-81, 67], id: "route-point-9", iconUrl: "icons/icon-9.png", width: 350, height: 300 },
    { coords: [-70, 65], id: "route-point-10", iconUrl: "icons/icon-10.png", width: 350, height: 300 },
    { coords: [-75, 59], id: "route-point-11", iconUrl: "icons/icon-11.png", width: 350, height: 300 },
    { coords: [-55, 51], id: "route-point-13", iconUrl: "icons/icon-13.png", width: 350, height: 300 },
    { coords: [-33, 61], id: "route-point-14", iconUrl: "icons/icon-14.png", width: 350, height: 300 }
  ];

  // ==========================================
  // 2. ВЫВОД ИЛЛЮСТРАЦИЙ КАК ЧАСТЕЙ КАРТЫ
  // ==========================================
  mainRoutePoints.forEach(function(point) {
    var imgWidth = point.width || 350;
    var imgHeight = point.height || 300;

    // Переводим точку привязки в пиксели макета при максимальном зуме
    var centerPx = map.project(point.coords, maxZoom);

    // Вычисляем границы иллюстрации (с привязкой по нижнему центру)
    var southWestPx = L.point(centerPx.x - imgWidth / 2, centerPx.y);
    var northEastPx = L.point(centerPx.x + imgWidth / 2, centerPx.y - imgHeight);

    // Привязываем границы напрямую к координатам подложки
    var overlayBounds = L.latLngBounds(
      map.unproject(southWestPx, maxZoom),
      map.unproject(northEastPx, maxZoom)
    );

    // Добавляем иллюстрацию как интерактивный слой карты
    var overlay = L.imageOverlay(point.iconUrl, overlayBounds, {
      interactive: true
    }).addTo(map);

    overlay.on('click', function() {
      alert("Клик: " + point.id);
    });
  });
</script>

</body>
</html>
