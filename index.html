<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var w = 6059;
  var h = 12681;
  var maxZoom = 6;
  var minZoom = 3;

  var map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: minZoom,
    maxZoom: maxZoom,
    zoomSnap: 0.1,
    maxBoundsViscosity: 1.0,
    attributionControl: false // <-- Отключает копирайт Leaflet внизу справа
  });

  var southWest = map.unproject([0, h], maxZoom);
  var northEast = map.unproject([w, 0], maxZoom);
  var bounds = new L.LatLngBounds(southWest, northEast);

  L.tileLayer('tiles/{z}/{y}/{x}.png', {
    minZoom: minZoom,
    maxZoom: maxZoom,
    tileSize: 256,
    bounds: bounds,
    noWrap: true,
    errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7'
  }).addTo(map);

  map.setMaxBounds(bounds);

  // Начальная позиция и масштаб
  var initialX = 2800;
  var initialY = 8500;
  var startZoom = 4.8;

  var startCenter = map.unproject([initialX, initialY], maxZoom);
  map.setView(startCenter, startZoom);

  window.addEventListener('load', function() {
    setTimeout(function() {
      map.invalidateSize();
    }, 200);
  });
</script>

</body>
</html>
